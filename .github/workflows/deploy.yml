name: Déploiement Automatique Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: resonant-production
      cancel-in-progress: false
    steps:
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
              set -eu
              cd ~/resonant-lab
              git pull --ff-only origin main
              .venv/bin/python -m pip install --disable-pip-version-check pip==26.2.1
              .venv/bin/python -m pip install -r requirements.lock.txt
              .venv/bin/python -m pip check
              .venv/bin/python scripts/prepare_local_runtime.py --download
              .venv/bin/python -c 'import json; from pathlib import Path; assert json.loads(Path(".local/compute-runtime/manifest.json").read_text())["ready"], "Runtime incomplet"'
              sudo systemctl restart resonant-lab
