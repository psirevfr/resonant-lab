# Include once inside the existing HTTPS server, retaining TLS and proxy headers.
client_max_body_size 129m;
client_body_timeout 30s;
client_header_timeout 15s;
server_tokens off;
limit_req_status 429;
limit_req zone=resonant_auth burst=10 nodelay;
limit_req zone=resonant_compute burst=30 nodelay;

# A real 503 during an approved switch; checked on every request.
open_file_cache off;
if (-f /var/lib/resonant-maintenance/bascule.flag) { return 503; }
error_page 503 =503 @resonant_maintenance;
location @resonant_maintenance {
    default_type text/plain;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store" always;
    return 503 "Maintenance de Resonant Lab. Reessayez dans une minute.\n";
}
