# Merge into the EXISTING HTTPS server block, retaining its TLS and timeout settings.
# Replace its existing location /; do not create a second duplicate location.
error_page 503 =503 /maintenance.html;
location = /maintenance.html {
    internal;
    root /var/lib/resonant-maintenance;
    add_header Retry-After 120 always;
    add_header Cache-Control "no-store" always;
}
location / {
    # Avoid inherited caching of the toggle file.
    open_file_cache off;
    if (-f /var/lib/resonant-maintenance/maintenance.flag) { return 503; }
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# If /api or other routes have their own proxy locations, add open_file_cache off and the SAME flag guard
# there too, or they will bypass maintenance. Keep ACME challenge locations intact.
