# http context. Empty keys exclude reads/polling from expensive-action quotas.
map "$request_method:$uri" $resonant_auth_key {
    default "";
    ~^POST:/(login|register)/?$ $binary_remote_addr;
}
map "$request_method:$uri" $resonant_compute_key {
    default "";
    ~^POST:/api/(audio|demo|analyze|generate|optimize|compact|render|compute/input|instrument/note)$ $binary_remote_addr;
}
limit_req_zone $resonant_auth_key zone=resonant_auth:1m rate=10r/m;
limit_req_zone $resonant_compute_key zone=resonant_compute:1m rate=60r/m;
